name: EAS iOS Submit to App Store

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: 'EAS Build ID to submit (default: latest production iOS build)'
        required: false
        default: '65a6e295-ce6c-4f72-a4c8-704b6bc75116'

jobs:
  submit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Restore Apple API Key
        run: |
          echo "${{ secrets.EXPO_APPLE_API_KEY }}" | base64 -d > /tmp/AuthKey.p8
          ls -la /tmp/AuthKey.p8

      - name: Submit to App Store Connect
        run: |
          eas submit -p ios --id ${{ inputs.build_id }} --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_ASC_API_KEY_PATH: /tmp/AuthKey.p8
          EXPO_ASC_API_KEY_ID: ${{ secrets.EXPO_APPLE_API_KEY_ID }}
          EXPO_ASC_API_KEY_ISSUER_ID: ${{ secrets.EXPO_APPLE_API_ISSUER_ID }}
