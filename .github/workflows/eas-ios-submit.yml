name: EAS iOS Submit to App Store

on:
  workflow_dispatch:

jobs:
  submit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Download IPA from release
        run: |
          gh release download ios-build-20 --repo deepdusk1/kamino --pattern "*.ipa" --dir ./
          ls -lh ./*.ipa
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore Apple API Key
        run: |
          echo "${{ secrets.EXPO_APPLE_API_KEY }}" | base64 -d > ./AuthKey.p8
          ls -la ./AuthKey.p8

      - name: Submit to App Store Connect
        run: |
          eas submit -p ios --path ./kamino-1.0.0-20.ipa --non-interactive --verbose
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
